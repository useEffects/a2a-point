server {
    listen 80;

    location /nginx-healthcheck {
        access_log off;
        return 200;
    }
}

server {
    listen 443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_name dev.a2apoint.com;

    resolver 127.0.0.11 valid=30s;
    set $var_webapp webapp:3000

    ssl_certificate /app/ssl/certificate_ca_bundle.cert;
    ssl_certificate_key /app/ssl/private_key.pem;

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://var_webapp;
    }

    location /_next/webpack-hmr {
        proxy_pass http://var_webapp/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_name dashboard.a2apoint.com;

    resolver 127.0.0.11 valid=30s;
    set $var_dashboard dashboard:8055

    ssl_certificate /app/ssl/certificate_ca_bundle.cert;
    ssl_certificate_key /app/ssl/private_key.pem;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-NginX-Proxy true;

        proxy_pass http://var_dashboard/;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    location /websocket {
        proxy_pass http://var_dashboard/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}


server {
    listen 443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_name auth.a2apoint.com;

    resolver 127.0.0.11 valid=30s;
    set $var_auth auth:8080

    ssl_certificate /app/ssl/certificate_ca_bundle.cert;
    ssl_certificate_key /app/ssl/private_key.pem;

    location / {
        resolver 127.0.0.11 valid=30s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://var_auth;
    }
}

server {
    listen 80;
    server_name dev.a2apoint.com dev.auth.a2apoint.com dev.dashboard.a2apoint.com;

    return 301 https://$host$request_uri;
}