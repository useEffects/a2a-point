resolver 127.0.0.11 valid=30s;

server {
    listen 443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_name a2apoint.com www.a2apoint.com;

    ssl_certificate /app/ssl/certificate_ca_bundle.cert;
    ssl_certificate_key /app/ssl/private_key.pem;

    location / {
        set $var_web "web:3000";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://$var_web;
    }
}

server {
    listen 443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_name dashboard.a2apoint.com;

    ssl_certificate /app/ssl/certificate_ca_bundle.cert;
    ssl_certificate_key /app/ssl/private_key.pem;

    location / {
        set $var_dashboard "dashboard:8055";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://$var_dashboard;
    }

    location /websocket {
        set $var_dashboard "dashboard:8055";

        proxy_pass http://$var_dashboard/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_hide_header Cookie;
        proxy_set_header Cookie '';
    }
}

server {
    listen 443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_name auth.a2apoint.com;

    ssl_certificate /app/ssl/certificate_ca_bundle.cert;
    ssl_certificate_key /app/ssl/private_key.pem;

    location / {
        set $var_auth "auth:8080";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://$var_auth;
    }
}

server {
    listen 80;
    server_name a2apoint.com www.a2apoint.com auth.a2apoint.com dashboard.a2apoint.com;

    return 301 https://$host$request_uri;
}
